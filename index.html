<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library Management System</title>
  <style>
    :root {
      --bg-page: #F5F6F8;
      --bg-surface: #FFFFFF;
      --color-primary: #263B5A;
      --color-primary-hover: #1D2E47;
      --color-secondary: #64748B;
      --color-success: #198754;
      --color-danger: #DC3545;
      --color-issued: #0D6EFD;
      --color-border: #DEE2E6;
      --color-text: #212529;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      background-color: var(--bg-page);
      color: var(--color-text);
      font-size: 14px;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Navigation */
    .navbar {
      background-color: var(--color-primary);
      color: #FFFFFF;
      border-bottom: 1px solid #1C2D46;
    }

    .navbar-container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      min-height: 56px;
    }

    .navbar-brand {
      font-size: 18px;
      font-weight: 700;
      padding: 12px 0;
      cursor: pointer;
    }

    .navbar-toggle {
      display: none;
      background: transparent;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 3px;
      padding: 5px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .navbar-links {
      display: flex;
      align-items: center;
      gap: 6px;
      list-style: none;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: #E2E8F0;
      font-family: inherit;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 3px;
      cursor: pointer;
      text-align: left;
    }

    .nav-btn:hover {
      background-color: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
    }

    .nav-btn.active {
      background-color: rgba(255, 255, 255, 0.2);
      color: #FFFFFF;
      font-weight: 600;
    }

    /* Main Layout */
    .main-container {
      max-width: 1180px;
      margin: 24px auto;
      padding: 0 20px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--color-text);
    }

    .section-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--color-border);
      border-radius: 3px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--color-text);
    }

    /* Dashboard Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--color-border);
      border-radius: 3px;
      padding: 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .stat-label {
      font-size: 13px;
      color: var(--color-secondary);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--color-text);
    }

    .stat-value.danger-text {
      color: var(--color-danger);
    }

    .stat-icon {
      color: var(--color-primary);
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* Buttons */
    .btn {
      display: inline-block;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      border-radius: 3px;
      border: 1px solid transparent;
      cursor: pointer;
      text-align: center;
      line-height: 1.3;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: #FFFFFF;
      border-color: var(--color-primary);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--color-primary-hover);
    }

    .btn-secondary {
      background-color: #FFFFFF;
      color: var(--color-text);
      border-color: var(--color-border);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #F1F3F5;
    }

    .btn-outline-danger {
      background-color: #FFFFFF;
      color: var(--color-danger);
      border-color: var(--color-danger);
    }

    .btn-outline-danger:hover:not(:disabled) {
      background-color: var(--color-danger);
      color: #FFFFFF;
    }

    .btn-sm {
      padding: 4px 9px;
      font-size: 12px;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .filter-input {
      flex: 1 1 240px;
      min-width: 180px;
    }

    .filter-select {
      flex: 0 1 190px;
      min-width: 150px;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      color: var(--color-text);
      cursor: pointer;
      user-select: none;
    }

    /* Tables */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--color-border);
      border-radius: 3px;
      background-color: var(--bg-surface);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 680px;
    }

    .data-table th,
    .data-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--color-border);
      vertical-align: middle;
    }

    .data-table th {
      background-color: #F8F9FA;
      font-weight: 700;
      font-size: 13px;
      color: var(--color-text);
      border-bottom: 2px solid var(--color-border);
      white-space: nowrap;
    }

    .data-table tbody tr:last-child td {
      border-bottom: none;
    }

    .data-table tbody tr:hover {
      background-color: #FAFBFD;
    }

    .table-actions {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
    }

    .copies-zero {
      color: var(--color-danger);
      font-weight: 700;
    }

    /* Status Badges */
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 2px;
      white-space: nowrap;
    }

    .status-issued {
      background-color: #E7F1FF;
      color: var(--color-issued);
      border: 1px solid #B6D4FE;
    }

    .status-returned {
      background-color: #E8F5EE;
      color: var(--color-success);
      border: 1px solid #BADBCC;
    }

    .status-overdue {
      background-color: #FBE9EB;
      color: var(--color-danger);
      border: 1px solid #F5C2C7;
    }

    /* Pagination */
    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      font-size: 13px;
      color: var(--color-secondary);
    }

    .pagination-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Forms */
    .form-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--color-border);
      border-radius: 3px;
      padding: 22px;
      max-width: 640px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--color-text);
      font-size: 14px;
    }

    .required-mark {
      color: var(--color-danger);
    }

    .form-control {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--color-text);
      background-color: #FFFFFF;
      border: 1px solid var(--color-border);
      border-radius: 3px;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field-error {
      margin-top: 4px;
      font-size: 12px;
      color: var(--color-danger);
    }

    .form-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    /* Alerts & Details */
    .alert {
      padding: 10px 14px;
      border-radius: 3px;
      margin-bottom: 16px;
      font-size: 14px;
      border: 1px solid transparent;
    }

    .alert-error {
      background-color: #FBE9EB;
      color: #842029;
      border-color: #F5C2C7;
    }

    .alert-success {
      background-color: #E8F5EE;
      color: #0F5132;
      border-color: #BADBCC;
    }

    .empty-state {
      padding: 26px 16px;
      text-align: center;
      color: var(--color-secondary);
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
    }

    .detail-item-label {
      font-size: 12px;
      color: var(--color-secondary);
      margin-bottom: 3px;
    }

    .detail-item-value {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text);
    }

    .info-box {
      background-color: #F8F9FA;
      border: 1px solid var(--color-border);
      border-radius: 3px;
      padding: 12px 14px;
      margin-bottom: 18px;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .navbar-toggle {
        display: block;
      }

      .navbar-links {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        padding-bottom: 12px;
        gap: 4px;
      }

      .navbar-links.open {
        display: flex;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .main-container {
        margin: 16px auto;
        padding: 0 14px;
      }
    }

    @media (max-width: 480px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .form-card,
      .section-card {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="navbar-container">
      <div class="navbar-brand" id="brandLink">Library Management System</div>
      <button type="button" class="navbar-toggle" id="navToggle" aria-expanded="false">Menu</button>
      <ul class="navbar-links" id="navLinks">
        <li><button type="button" class="nav-btn" data-route="dashboard">Dashboard</button></li>
        <li><button type="button" class="nav-btn" data-route="books">Books</button></li>
        <li><button type="button" class="nav-btn" data-route="add-book">Add Book</button></li>
        <li><button type="button" class="nav-btn" data-route="loans">Loan History</button></li>
      </ul>
    </div>
  </header>

  <main class="main-container" id="app"></main>

  <script>
    (function () {
      const API_BASE =
        window.location.protocol === 'file:'
          ? 'http://localhost:5000/api'
          : '/api';

      const CATEGORIES = [
        'Computer Science',
        'Mathematics',
        'Physics',
        'Engineering',
        'Literature',
        'History',
        'Business',
        'General'
      ];

      const FINE_PER_DAY = 1;
      const PAGE_SIZE = 10;

      const state = {
        route: 'dashboard',
        selectedId: null,
        booksSearch: '',
        booksCategory: 'All',
        booksAvailableOnly: false,
        booksPage: 1,
        loansSearch: '',
        loansStatus: 'All',
        loansPage: 1,
        flashMessage: '',
        flashType: 'success'
      };

      let renderSeq = 0;
      let booksSearchTimer = null;
      let loansSearchTimer = null;

      async function apiRequest(path, options = {}) {
        let response;
        try {
          response = await fetch(`${API_BASE}${path}`, {
            headers: {
              'Content-Type': 'application/json',
              ...(options.headers || {})
            },
            ...options
          });
        } catch (networkErr) {
          throw new Error(
            `Unable to connect to the backend API (${API_BASE}). Make sure the Express server connected to MongoDB is running.`
          );
        }

        let data = null;
        try {
          data = await response.json();
        } catch (parseErr) {
          data = null;
        }

        if (!response.ok) {
          throw new Error((data && data.message) || `Request failed (${response.status})`);
        }

        return data;
      }

      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function getTodayStr() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function getDatePlusDaysStr(days) {
        const date = new Date();
        date.setDate(date.getDate() + days);
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function toUtcDayStartMs(dateStr) {
        if (!dateStr) return 0;
        const isoDate = String(dateStr).slice(0, 10);
        const parts = isoDate.split('-').map(Number);
        if (parts.length !== 3 || parts.some(Number.isNaN)) return 0;
        return Date.UTC(parts[0], parts[1] - 1, parts[2]);
      }

      function getOverdueDays(dueDateStr, refDateStr = getTodayStr()) {
        const msPerDay = 24 * 60 * 60 * 1000;
        const diff = Math.floor((toUtcDayStartMs(refDateStr) - toUtcDayStartMs(dueDateStr)) / msPerDay);
        return diff > 0 ? diff : 0;
      }

      function getLoanDisplayStatus(loan) {
        if (loan.displayStatus) return loan.displayStatus;
        if (loan.status === 'Returned') return 'Returned';
        return getOverdueDays(loan.dueDate) > 0 ? 'Overdue' : 'Issued';
      }

      function getStatusClass(displayStatus) {
        if (displayStatus === 'Returned') return 'status-badge status-returned';
        if (displayStatus === 'Overdue') return 'status-badge status-overdue';
        return 'status-badge status-issued';
      }

      function formatDate(dateStr) {
        if (!dateStr) return '-';
        const ms = toUtcDayStartMs(dateStr);
        if (!ms) return '-';
        return new Date(ms).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          timeZone: 'UTC'
        });
      }

      function formatCurrency(val) {
        return '$' + Number(val || 0).toFixed(2);
      }

      function navigate(route, id = null, clearFlash = true) {
        state.route = route;
        state.selectedId = id;
        if (clearFlash) {
          state.flashMessage = '';
        }
        document.getElementById('navLinks').classList.remove('open');
        document.getElementById('navToggle').setAttribute('aria-expanded', 'false');
        render();
      }

      function updateNavHighlight() {
        const buttons = document.querySelectorAll('.nav-btn');
        buttons.forEach((btn) => {
          const target = btn.getAttribute('data-route');
          const isBooksSub =
            target === 'books' &&
            ['books', 'view-book', 'edit-book', 'issue-book'].includes(state.route);
          const isLoansSub =
            target === 'loans' && ['loans', 'return-book'].includes(state.route);
          btn.classList.toggle('active', target === state.route || isBooksSub || isLoansSub);
        });
      }

      function bindCommonActions(root) {
        root.querySelectorAll('[data-nav]').forEach((el) => {
          el.addEventListener('click', () => navigate(el.getAttribute('data-nav')));
        });

        root.querySelectorAll('[data-action]').forEach((el) => {
          el.addEventListener('click', () => {
            const action = el.getAttribute('data-action');
            const id = el.getAttribute('data-id');

            if (action === 'view-book') navigate('view-book', id);
            if (action === 'edit-book') navigate('edit-book', id);
            if (action === 'issue-book') navigate('issue-book', id);
            if (action === 'return-loan') navigate('return-book', id);
            if (action === 'delete-book') handleDeleteBook(id);
          });
        });
      }

      async function renderDashboard() {
        const data = await apiRequest('/dashboard');
        const stats = data.stats || {};
        const recentLoans = data.recentlyIssued || [];

        const totalBooks = Number(stats.totalBooks || 0);
        const totalCopies = Number(stats.totalCopies || 0);
        const issuedCopies = Number(stats.issuedCopies || 0);
        const overdueBooks = Number(stats.overdueBooks || 0);
        const totalFineCollected = Number(stats.totalFineCollected || 0);

        const rowsHtml =
          recentLoans.length === 0
            ? `<tr><td colspan="6" class="empty-state">No books have been issued yet.</td></tr>`
            : recentLoans
                .map((loan) => {
                  const status = getLoanDisplayStatus(loan);
                  return `
                    <tr>
                      <td>${escapeHtml(loan.bookCode)}</td>
                      <td>${escapeHtml(loan.bookTitle)}</td>
                      <td>${escapeHtml(loan.borrowerName)}</td>
                      <td>${formatDate(loan.issueDate)}</td>
                      <td>${formatDate(loan.dueDate)}</td>
                      <td><span class="${getStatusClass(status)}">${status}</span></td>
                    </tr>
                  `;
                })
                .join('');

        return `
          <div class="page-header">
            <h1 class="page-title">Dashboard</h1>
            <button type="button" class="btn btn-primary" data-nav="books">Browse Books</button>
          </div>

          <div class="stats-grid">
            <div class="stat-card">
              <div>
                <div class="stat-label">Total Books</div>
                <div class="stat-value">${totalBooks}</div>
              </div>
              <svg class="stat-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
              </svg>
            </div>

            <div class="stat-card">
              <div>
                <div class="stat-label">Total Copies</div>
                <div class="stat-value">${totalCopies}</div>
              </div>
              <svg class="stat-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="4" y="4" width="14" height="16" rx="1" />
                <path d="M8 2h12v16" />
              </svg>
            </div>

            <div class="stat-card">
              <div>
                <div class="stat-label">Issued Copies</div>
                <div class="stat-value">${issuedCopies}</div>
              </div>
              <svg class="stat-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M16 3h5v5" />
                <path d="M21 3l-7 7" />
                <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5" />
              </svg>
            </div>

            <div class="stat-card">
              <div>
                <div class="stat-label">Overdue Books</div>
                <div class="stat-value ${overdueBooks > 0 ? 'danger-text' : ''}">${overdueBooks}</div>
              </div>
              <svg class="stat-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5l3 2" />
              </svg>
            </div>

            <div class="stat-card">
              <div>
                <div class="stat-label">Total Fine Collected</div>
                <div class="stat-value">${formatCurrency(totalFineCollected)}</div>
              </div>
              <svg class="stat-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="9" />
                <path d="M14.5 9a2.5 2.5 0 0 0-5 0c0 1.5 2.5 2 2.5 2s2.5.5 2.5 2a2.5 2.5 0 0 1-5 0" />
                <path d="M12 6v12" />
              </svg>
            </div>
          </div>

          <div class="section-card">
            <div class="page-header" style="margin-bottom: 12px;">
              <h2 class="section-title" style="margin-bottom: 0;">Recently Issued Books</h2>
              <button type="button" class="btn btn-secondary btn-sm" data-nav="loans">View All Loans</button>
            </div>
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Book Code</th>
                    <th>Title</th>
                    <th>Borrower</th>
                    <th>Issue Date</th>
                    <th>Due Date</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
              </table>
            </div>
          </div>
        `;
      }

      async function fetchBooksData() {
        const params = new URLSearchParams({
          search: state.booksSearch.trim(),
          category: state.booksCategory,
          availableOnly: String(state.booksAvailableOnly),
          page: String(state.booksPage),
          limit: String(PAGE_SIZE)
        });
        return apiRequest(`/books?${params.toString()}`);
      }

      function buildBooksTableSectionHtml(data) {
        const books = data.books || [];
        const pagination = data.pagination || { total: 0, page: 1, limit: PAGE_SIZE, totalPages: 1 };
        const total = pagination.total;
        const page = pagination.page;
        const totalPages = pagination.totalPages;
        if (state.booksPage > totalPages) state.booksPage = totalPages;

        const startItem = total === 0 ? 0 : (page - 1) * pagination.limit + 1;
        const endItem = Math.min(page * pagination.limit, total);

        const rowsHtml =
          books.length === 0
            ? `<tr><td colspan="6" class="empty-state">No books found.</td></tr>`
            : books
                .map((book) => {
                  const id = escapeHtml(book._id);
                  const availClass = book.availableCopies === 0 ? 'copies-zero' : '';
                  const issueBtn =
                    book.availableCopies > 0

      function buildLoansTableSectionHtml(data) {
        const loans = data.loans || [];
        const pagination = data.pagination || { total: 0, page: 1, limit: PAGE_SIZE, totalPages: 1 };
        const total = pagination.total;
        const page = pagination.page;
        const totalPages = pagination.totalPages;
        if (state.loansPage > totalPages) state.loansPage = totalPages;

        const startItem = total === 0 ? 0 : (page - 1) * pagination.limit + 1;
        const endItem = Math.min(page * pagination.limit, total);

        const rowsHtml =
          loans.length === 0
            ? `<tr><td colspan="10" class="empty-state">No loan records found.</td></tr>`
            : loans
                .map((loan) => {
                  const status = getLoanDisplayStatus(loan);
                  return `
                    <tr>
                      <td>${escapeHtml(loan.bookCode)}</td>
                      <td>${escapeHtml(loan.bookTitle)}</td>
                      <td>${escapeHtml(loan.borrowerName)}</td>
                      <td>${escapeHtml(loan.borrowerId)}</td>
                      <td>${formatDate(loan.issueDate)}</td>
                      <td>${formatDate(loan.dueDate)}</td>
                      <td>${formatDate(loan.returnDate)}</td>
                      <td>${formatCurrency(loan.fineAmount)}</td>
                      <td><span class="${getStatusClass(status)}">${status}</span></td>
                      <td>
                        ${
                          loan.status === 'Issued'
                            ? `<button type="button" class="btn btn-primary btn-sm" data-action="return-loan" data-id="${escapeHtml(loan._id)}">Return</button>`
                            : '-'
                        }
                      </td>
                    </tr>
                  `;
                })
                .join('');

        return `
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Book Code</th>
                  <th>Title</th>
                  <th>Borrower</th>
                  <th>Borrower ID</th>
                  <th>Issue Date</th>
                  <th>Due Date</th>
                  <th>Return Date</th>
                  <th>Fine</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>

          <div class="pagination-bar">
            <span>Showing ${startItem} to ${endItem} of ${total} records</span>
            <div class="pagination-controls">
              <button type="button" class="btn btn-secondary btn-sm" id="loansPrevBtn" ${page <= 1 ? 'disabled' : ''}>Previous</button>
              <span>Page ${page} of ${totalPages}</span>
              <button type="button" class="btn btn-secondary btn-sm" id="loansNextBtn" ${page >= totalPages ? 'disabled' : ''}>Next</button>
            </div>
          </div>
        `;
      }

        const app = document.getElementById('app');

          if (searchInput) {
            searchInput.addEventListener('input', (e) => {

              clearTimeout(booksSearchTimer);
              booksSearchTimer = setTimeout(refreshBooksTableOnly, 200);

              state.booksCategory = e.target.value;
              state.booksPage = 1;
              refreshBooksTableOnly();
            });
          }

          if (availCheck) {

              state.booksAvailableOnly = e.target.checked;
              state.booksPage = 1;
              refreshBooksTableOnly();
            });
          }

          attachBooksPaginationEvents();

        if (state.route === 'add-book' || state.route === 'edit-book') {
          const form = document.getElementById('bookForm');
          if (form) form.addEventListener('submit', handleBookSubmit);

          const form = document.getElementById('issueForm');
          if (form) form.addEventListener('submit', handleIssueSubmit);

          if (form) form.addEventListener('submit', handleReturnSubmit);

              loansSearchTimer = setTimeout(refreshLoansTableOnly, 200);

      async function handleBookSubmit(e) {
        e.preventDefault();
        const bookCode = document.getElementById('bookCode').value.trim().toUpperCase();
        const category = document.getElementById('category').value.trim();
        const title = document.getElementById('title').value.trim();
        const author = document.getElementById('author').value.trim();
        const totalCopiesRaw = document.getElementById('totalCopies').value;
        const isbn = document.getElementById('isbn').value.trim();
        const totalCopies = Number(totalCopiesRaw);

        const errors = {};
        if (!bookCode) errors.bookCode = 'Book Code is required.';
        if (!category) errors.category = 'Please select a category.';
        if (!title) errors.title = 'Title is required.';
        if (!author) errors.author = 'Author is required.';
        if (!totalCopiesRaw || !Number.isInteger(totalCopies) || totalCopies < 1) {
          errors.totalCopies = 'Total Copies must be a whole number of at least 1.';
        }

        ['bookCode', 'category', 'title', 'author', 'totalCopies'].forEach((field) => {
          document.getElementById(`err-${field}`).textContent = errors[field] || '';
        });

        if (Object.keys(errors).length > 0) return;

        const serverErrBox = document.getElementById('bookFormServerError');
        const submitBtn = document.getElementById('bookSubmitBtn');
        serverErrBox.innerHTML = '';
        submitBtn.disabled = true;

        try {
          const payload = { bookCode, category, title, author, totalCopies, isbn };
          if (state.route === 'add-book') {
            await apiRequest('/books', {
              method: 'POST',
              body: JSON.stringify(payload)
            });
            state.flashMessage = `Added "${title}".`;
          } else {
            await apiRequest(`/books/${encodeURIComponent(state.selectedId)}`, {
              method: 'PUT',
              body: JSON.stringify(payload)
            });
            state.flashMessage = `Updated "${title}".`;
          }
          state.flashType = 'success';
          navigate('books', null, false);
        } catch (err) {
          serverErrBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
          submitBtn.disabled = false;
        }
      }

      async function handleDeleteBook(id) {
        if (!window.confirm('Are you sure you want to delete this book?')) {
          return;
        }

        try {
          await apiRequest(`/books/${encodeURIComponent(id)}`, { method: 'DELETE' });
          state.flashMessage = 'Book deleted successfully.';
          state.flashType = 'success';
        } catch (err) {
          state.flashMessage = err.message;
          state.flashType = 'error';
        }
        render();
      }

      async function handleIssueSubmit(e) {
        e.preventDefault();
        const borrowerName = document.getElementById('borrowerName').value.trim();
        const borrowerId = document.getElementById('borrowerId').value.trim();
        const borrowerPhone = document.getElementById('borrowerPhone').value.trim();
        const issueDate = document.getElementById('issueDate').value;
        const dueDate = document.getElementById('dueDate').value;

        const errors = {};
        if (!borrowerName) errors.borrowerName = 'Borrower Name is required.';
        if (!borrowerId) errors.borrowerId = 'Borrower ID is required.';
        if (!issueDate) errors.issueDate = 'Issue Date is required.';
        if (!dueDate) {
          errors.dueDate = 'Due Date is required.';
        } else if (issueDate && dueDate < issueDate) {
          errors.dueDate = 'Due Date cannot be earlier than Issue Date.';
        }

        ['borrowerName', 'borrowerId', 'issueDate', 'dueDate'].forEach((field) => {
          document.getElementById(`err-${field}`).textContent = errors[field] || '';
        });

        if (Object.keys(errors).length > 0) return;

        const errBox = document.getElementById('issueFormServerError');
        const submitBtn = document.getElementById('issueSubmitBtn');
        errBox.innerHTML = '';
        submitBtn.disabled = true;

        try {
          const loan = await apiRequest('/loans', {
            method: 'POST',
            body: JSON.stringify({
              bookId: state.selectedId,
              borrowerName,
              borrowerId,
              borrowerPhone,
              issueDate,
              dueDate
            })
          });
          state.flashMessage = `Issued "${loan.bookTitle}" to ${borrowerName}.`;
          state.flashType = 'success';
          navigate('loans', null, false);
        } catch (err) {
          errBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
          submitBtn.disabled = false;
        }
      }

      async function handleReturnSubmit(e) {
        e.preventDefault();
        const returnDate = document.getElementById('returnDate').value;
        const fineAmount = Number(document.getElementById('fineAmount').value);
        const errBox = document.getElementById('returnFormError');
        const submitBtn = document.getElementById('returnSubmitBtn');
        errBox.innerHTML = '';

        if (!returnDate) {
          errBox.innerHTML = '<div class="alert alert-error">Return Date is required.</div>';
          return;
        }

        if (Number.isNaN(fineAmount) || fineAmount < 0) {
          errBox.innerHTML = '<div class="alert alert-error">Fine amount must be 0 or greater.</div>';
          return;
        }

        if (submitBtn) submitBtn.disabled = true;

        try {
          const loan = await apiRequest(`/loans/${encodeURIComponent(state.selectedId)}/return`, {
            method: 'PUT',
            body: JSON.stringify({ returnDate, fineAmount })
          });
          state.flashMessage = `Returned "${loan.bookTitle}".`;
          state.flashType = 'success';
          navigate('loans', null, false);
        } catch (err) {
          errBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
          if (submitBtn) submitBtn.disabled = false;
        }
      }

      async function render() {
        const seq = ++renderSeq;
        updateNavHighlight();
        const app = document.getElementById('app');
        app.innerHTML = '<div class="section-card">Loading...</div>';

        try {
          let html = '';
          if (state.route === 'dashboard') html = await renderDashboard();
          else if (state.route === 'books') html = await renderBooks();
          else if (state.route === 'add-book') html = renderBookForm(null);
          else if (state.route === 'edit-book') {
            const data = await apiRequest(`/books/${encodeURIComponent(state.selectedId)}`);
            html = renderBookForm(data.book);
          } else if (state.route === 'view-book') html = await renderViewBook();
          else if (state.route === 'issue-book') html = await renderIssueBook();
          else if (state.route === 'return-book') html = await renderReturnBook();
          else if (state.route === 'loans') html = await renderLoanHistory();

          if (seq !== renderSeq) return;
          app.innerHTML = html;
          attachPageEvents();
        } catch (err) {
          if (seq !== renderSeq) return;
          app.innerHTML = `
            <div class="alert alert-error">${escapeHtml(err.message)}</div>
            <button type="button" class="btn btn-secondary" data-nav="dashboard">Retry</button>
          `;
          bindCommonActions(app);
        }
      }

      document.getElementById('brandLink').addEventListener('click', () => navigate('dashboard'));

      document.getElementById('navToggle').addEventListener('click', () => {
        const navLinks = document.getElementById('navLinks');
        const isOpen = navLinks.classList.toggle('open');
        document.getElementById('navToggle').setAttribute('aria-expanded', String(isOpen));
      });

      document.querySelectorAll('.nav-btn').forEach((btn) => {
        btn.addEventListener('click', () => navigate(btn.getAttribute('data-route')));
      });

      render();
    })();
  </script>
</body>
</html>
